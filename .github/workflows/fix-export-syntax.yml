name: Corregir sintaxis exportacion Excel

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir llave extra
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("  let ws=XLSX.utils.json_to_sheet(data,{cellDates:false});\n  }\n  ws['!cols']", "  let ws=XLSX.utils.json_to_sheet(data,{cellDates:false});\n  ws['!cols']")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Corrige exportación Excel solo con Tecnicatura ID"
          git push
