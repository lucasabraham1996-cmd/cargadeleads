name: Fix CRM Excel export

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exportExcel
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "function exportExcel(){if(!rows.length)return toast('No hay datos');let data=rows.map(r=>({'Nombre Completo':r.nombre,'Teléfono':r.telefono,'Email':r.email,'Tecnicatura ID':r.tecnicaturaId,'Carrera':CareerMapper[r.tecnicaturaId]?.label||'','Fuente':r.fuente,'Provincia':r.provincia,'Estado':'sin_contacto','Observaciones':r.observaciones,'Vendedor ID':''}));let ws=XLSX.utils.json_to_sheet(data),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Leads');XLSX.writeFile(wb,`Leads_CRM_${new Date().toISOString().slice(0,10)}.xlsx`);toast('Excel generado')}"
          new = """function exportExcel(){
            if(!rows.length)return toast('No hay datos');
            const invalidCareer=rows.filter(r=>!/^\\d+$/.test(String(r.tecnicaturaId||''))||!CareerMapper[String(r.tecnicaturaId)]);
            if(invalidCareer.length){
              toast(`Hay ${invalidCareer.length} lead(s) sin carrera válida. Asignales una carrera antes de exportar.`);
              return;
            }
            const invalidPhone=rows.filter(r=>r.telefono&&String(r.telefono).replace(/\\D/g,'').length<10);
            if(invalidPhone.length){
              toast(`Hay ${invalidPhone.length} teléfono(s) incompletos. Revisalos antes de exportar.`);
              return;
            }
            let data=rows.map(r=>({
              'Nombre Completo':String(r.nombre||'').trim(),
              'Teléfono':String(r.telefono||'').replace(/\\D/g,''),
              'Email':String(r.email||'').trim(),
              'Tecnicatura ID':Number(r.tecnicaturaId),
              'Carrera':CareerMapper[String(r.tecnicaturaId)]?.label||'',
              'Fuente':String(r.fuente||'').trim(),
              'Provincia':String(r.provincia||'').trim(),
              'Estado':'sin_contacto',
              'Observaciones':String(r.observaciones||'').trim()
            }));
            let ws=XLSX.utils.json_to_sheet(data,{cellDates:false});
            const headers=Object.keys(data[0]);
            const techCol=headers.indexOf('Tecnicatura ID');
            if(techCol>=0){
              for(let i=1;i<=data.length;i++){
                const cell=XLSX.utils.encode_cell({r:i,c:techCol});
                if(ws[cell]){ws[cell].t='n';ws[cell].v=Number(ws[cell].v);}
              }
            }
            ws['!cols']=[{wch:28},{wch:18},{wch:30},{wch:15},{wch:30},{wch:22},{wch:24},{wch:18},{wch:42}];
            let wb=XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb,ws,'Leads');
            XLSX.writeFile(wb,`Leads_CRM_${new Date().toISOString().slice(0,10)}.xlsx`);
            toast(`Excel generado: ${data.length} lead(s) validados para CRM`)
          }"""
          if old not in s:
              raise SystemExit('No se encontró la función exportExcel esperada; no se modificó el archivo.')
          p.write_text(s.replace(old,new),encoding='utf-8')
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Corrige exportación Excel compatible con CRM"
          git push
