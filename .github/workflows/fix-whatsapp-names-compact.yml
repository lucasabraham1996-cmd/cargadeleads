name: Fix WhatsApp names and compact cards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-whatsapp-names-compact.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          helper = r'''
function extractWhatsappProfileName(text) {
  const raw = String(text || '').replace(/\r/g, '');
  const lines = raw.split('\n').map(x => x.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const stop = /^(no es un contacto|ning[uú]n grupo|herramientas de seguridad|bloquear|hoy|ayer|viernes|lunes|martes|mi[eé]rcoles|jueves|s[aá]bado|domingo|tu empresa usa|haz clic|servicio seguro|a[nñ]adir a la lista)/i;
  const candidateFrom = value => {
    let v = String(value || '')
      .replace(/^[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+/, '')
      .replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ' .-]+$/g, '')
      .replace(/\s+/g, ' ')
      .trim();
    if (!v || stop.test(v) || /\d|@|https?:/i.test(v)) return '';
    const words = v.split(/\s+/).filter(Boolean);
    if (words.length < 1 || words.length > 4 || v.length > 45) return '';
    return cleanupName(v);
  };

  // 1) Nombre con el indicador de perfil de WhatsApp: ~Erika, ～Erika, ˜Erika.
  for (const line of lines.slice(0, 30)) {
    const m = line.match(/^[~～˜^`'\-–—.:;·•]+\s*([A-Za-zÁÉÍÓÚÜÑáéíóúüñ][A-Za-zÁÉÍÓÚÜÑáéíóúüñ' .-]{0,44})$/);
    if (m) {
      const v = candidateFrom(m[1]);
      if (v) return v;
    }
  }

  // 2) En la ficha de WhatsApp el nombre está inmediatamente antes de “No es un contacto”.
  for (let i = 0; i < Math.min(lines.length, 35); i++) {
    if (!/^no es un contacto/i.test(normalize(lines[i]))) continue;
    for (let j = i - 1; j >= Math.max(0, i - 3); j--) {
      const v = candidateFrom(lines[j]);
      if (v) return v;
    }
  }

  // 3) Nombre en una de las líneas posteriores al teléfono del encabezado.
  const phoneLike = /(?:\+?\s*54\s*9?|\b54\s*9?)?[\s().-]*\d{2,4}(?:[\s().-]*\d{2,4}){2,4}/;
  for (let i = 0; i < Math.min(lines.length, 30); i++) {
    if (!phoneLike.test(lines[i])) continue;
    for (let j = i + 1; j <= Math.min(lines.length - 1, i + 3); j++) {
      if (stop.test(normalize(lines[j]))) break;
      const v = candidateFrom(lines[j]);
      if (v) return v;
    }
  }

  // 4) Respaldo para OCR que fusiona teléfono, nombre y texto de perfil en una sola línea.
  const flat = raw.replace(/\n+/g, ' ').replace(/\s+/g, ' ');
  const merged = flat.match(/(?:\+?\s*54\s*9?\s*)?(?:\d[\d\s().-]{8,}\d)\s*[~～˜^`'\-–—.:;·•]*\s*([A-Za-zÁÉÍÓÚÜÑáéíóúüñ][A-Za-zÁÉÍÓÚÜÑáéíóúüñ' .-]{1,44}?)(?=\s+(?:no es un contacto|ning[uú]n grupo|herramientas de seguridad|bloquear)\b)/i);
  if (merged) {
    const v = candidateFrom(merged[1]);
    if (v) return v;
  }
  return '';
}

'''
          marker = 'function detectName(text, email, source) {'
          if 'function extractWhatsappProfileName(text)' not in s:
              s = s.replace(marker, helper + marker, 1)

          needle = "  // 3) En WhatsApp, el nombre de perfil debajo del teléfono (~Erika) tiene prioridad sobre cualquier texto de interfaz.\n  const lines = raw.split('\\n').map(x => x.trim()).filter(Boolean);"
          replacement = "  // 3) En WhatsApp, detectar la ficha real del perfil por estructura: ~Nombre, nombre antes de ‘No es un contacto’ o debajo del teléfono.\n  if (source === 'WhatsApp Comercial') {\n    const profileName = extractWhatsappProfileName(raw);\n    if (profileName) return { name: profileName, confidence: 'alta', reason: 'Nombre de perfil de WhatsApp' };\n  }\n\n  const lines = raw.split('\\n').map(x => x.trim()).filter(Boolean);"
          if needle in s:
              s = s.replace(needle, replacement, 1)
          elif 'const profileName = extractWhatsappProfileName(raw);' not in s:
              anchor = "  const lines = raw.split('\\n').map(x => x.trim()).filter(Boolean);"
              s = s.replace(anchor, "  if (source === 'WhatsApp Comercial') {\n    const profileName = extractWhatsappProfileName(raw);\n    if (profileName) return { name: profileName, confidence: 'alta', reason: 'Nombre de perfil de WhatsApp' };\n  }\n\n" + anchor, 1)

          # Compactar las tarjetas de leads, especialmente en altura.
          replacements = {
            "card.className = 'lead-card enter rounded-[24px] overflow-hidden';": "card.className = 'lead-card enter rounded-[18px] overflow-hidden';",
            '<div class="h-1.5 w-full" style="background:${color}"></div>': '<div class="h-1 w-full" style="background:${color}"></div>',
            '<div class="p-4 md:p-5">': '<div class="p-3">',
            'gap-3 mb-4': 'gap-2 mb-2',
            'class="p-2 rounded-xl text-indigo-600': 'class="p-1.5 rounded-lg text-indigo-600',
            'class="p-2 rounded-xl text-slate-400': 'class="p-1.5 rounded-lg text-slate-400',
            'grid grid-cols-1 md:grid-cols-12 gap-4 items-start': 'grid grid-cols-1 md:grid-cols-12 gap-2 items-start',
            'rounded-2xl bg-white border border-slate-200 p-3.5': 'rounded-xl bg-white border border-slate-200 p-2.5',
            'gap-2 mb-2"><p class="text-[10px] uppercase': 'gap-2 mb-1"><p class="text-[9px] uppercase',
            'editable font-extrabold text-base w-full px-2 py-1.5': 'editable font-extrabold text-sm w-full px-1.5 py-1',
            'mt-2 flex items-center justify-between gap-2"><span class="text-[10px] text-slate-400 font-medium">Correo': 'mt-1 flex items-center justify-between gap-2"><span class="text-[9px] text-slate-400 font-medium">Correo',
            'mt-2 flex items-center gap-2 rounded-xl bg-slate-50 border border-slate-100 px-2.5 py-2': 'mt-1 flex items-center gap-2 rounded-lg bg-slate-50 border border-slate-100 px-2 py-1.5',
            'editable w-full px-1 py-1 text-[12px] text-slate-600': 'editable w-full px-1 py-0.5 text-[11px] text-slate-600',
            'rounded-xl bg-indigo-50 border border-indigo-100 px-2.5 py-2 flex items-center': 'rounded-lg bg-indigo-50 border border-indigo-100 px-2 py-1.5 flex items-center',
            'bg-transparent outline-none w-full font-mono text-sm font-bold': 'bg-transparent outline-none w-full font-mono text-[12px] font-bold',
            'mt-2 flex items-center justify-between"><span class="text-[10px] text-slate-400 font-medium">Provincia': 'mt-1 flex items-center justify-between"><span class="text-[9px] text-slate-400 font-medium">Provincia',
            'mt-1 flex items-center gap-2 rounded-xl bg-slate-50 border border-slate-100 px-2.5 py-2 text-slate-600': 'mt-1 flex items-center gap-2 rounded-lg bg-slate-50 border border-slate-100 px-2 py-1.5 text-slate-600',
            'editable w-full px-1 py-1 text-[12px]': 'editable w-full px-1 py-0.5 text-[11px]',
            'flex items-center gap-2 mb-2': 'flex items-center gap-2 mb-1',
            'text-[11px] text-slate-500 font-bold">Color CRM de la carrera': 'text-[9px] text-slate-500 font-bold">Color CRM de la carrera',
            'w-full bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-bold': 'w-full bg-white border border-slate-200 rounded-lg px-2 py-1.5 text-[12px] font-bold',
            'w-full text-[12px] font-bold rounded-xl px-3 py-2.5 border border-slate-200 bg-slate-50 outline-none mb-2': 'w-full text-[11px] font-bold rounded-lg px-2 py-1.5 border border-slate-200 bg-slate-50 outline-none mb-1',
            'mt-2 mb-1"><span class="text-[10px] text-slate-400 font-medium">Observaciones': 'mt-1 mb-1"><span class="text-[9px] text-slate-400 font-medium">Observaciones',
            'editable w-full rounded-xl border border-slate-100 bg-slate-50 px-3 py-2.5 text-[12px] text-slate-600 resize-none min-h-[90px]': 'editable w-full rounded-lg border border-slate-100 bg-slate-50 px-2 py-1.5 text-[11px] text-slate-600 resize-none min-h-[52px] h-[52px]'
          }
          for a, b in replacements.items():
              s = s.replace(a, b)

          p.write_text(s, encoding='utf-8')
      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-whatsapp-names-compact.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-whatsapp-names-compact.yml
          git commit -m "Corrige nombres de WhatsApp y compacta tarjetas [skip ci]"
          git push
